<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/caaaee1922.js" crossorigin="anonymous"></script>
    <title>Card Imobiliária</title>
</head>
<body>
    
    <main>
        <div class="container">
            <img src="src/img/image-card.png" class="Imobiliaria" alt="Apartamento">
            <div class="title-description">
                <h3 class="title">Apartamento Moderno</h3>
                <div class="assessment">
                    <img src="src/img/star.svg" alt="Estrela">
                    <p class="description-assessment">4.8 (42 Avaliações)</p>
                </div>
                <p class="description-title">Um belo apartamento moderno no centro da cidade</p>
            </div>
            <div class="specifications">
                <div class="icon-1">
                    <i class="fa-solid fa-ruler"></i>
                    <p class="specifications-description">85m²</p>
                </div>
                <div class="icon-1">
                    <i class="fa-solid fa-bed" ></i>
                    <p class="specifications-description">2 quartos</p>
                </div>
                <div class="icon-1">
                    <i class="fa-solid fa-bath"></i>
                    <p class="specifications-description">1 banheiro</p>
                </div>
                <div class="icon-1">
                    <i class="fa-solid fa-location-dot"></i>
                    <p class="specifications-description">Centro</p>
                </div>
            </div>
            <div class="labels">
                <p class="labels-description">Varanda</p>
                <p class="labels-description">Mobiliario</p>
                <p class="labels-description">Pet-friendly</p>
            </div>
            <div class="values">
                <h3>R$ 2500,00</h3>
                <div class="buttons">
                    <a href="#" class="btn">Agendar Visita</a>
                    <a href="#" class="btn-corretor">Contatar corretor</a>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
